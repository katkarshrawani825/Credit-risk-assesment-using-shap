<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan risk check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="intro">
      <h1>Will this loan be repaid?</h1>
      <p>Enter the applicant’s details and the model estimates the chance of default.</p>
    </header>

    <div class="layout">
      <form id="form" class="panel" novalidate>
        <div class="presets">
          <span>Try an example</span>
          <button type="button" data-preset="low">Low risk</button>
          <button type="button" data-preset="high">High risk</button>
        </div>
        <fieldset><legend>Applicant</legend><div class="grid" id="g-applicant"></div></fieldset>
        <fieldset><legend>Loan</legend><div class="grid" id="g-loan"></div></fieldset>
        <fieldset><legend>Credit history</legend><div class="grid" id="g-credit"></div></fieldset>
        <button class="go" id="go" type="submit"><span class="spin" aria-hidden="true"></span><b>Check risk</b></button>
      </form>

      <aside class="panel result idle" id="result" aria-live="polite">
        <div class="gauge">
          <svg viewBox="0 0 220 124" role="img" aria-label="Default probability gauge">
            <path class="track" d="M20 110 A90 90 0 0 1 200 110" pathLength="100"/>
            <path class="fill" id="fill" d="M20 110 A90 90 0 0 1 200 110" pathLength="100"/>
            <line class="tick" id="tick" x1="10" y1="110" x2="34" y2="110" transform="rotate(0 110 110)"/>
          </svg>
          <div class="reading"><strong id="pct">–</strong><span>chance of default</span></div>
        </div>
        <div class="verdict" id="verdict">Waiting for details</div>
        <p class="note" id="note">Fill in the form and select Check risk. The dark tick on the gauge marks the model’s cut-off.</p>
      </aside>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
